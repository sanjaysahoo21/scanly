# =============================================
# Scanly — Application Configuration
# =============================================

spring.application.name=scanly

# --- Server ---
server.port=${SERVER_PORT:8081}
spring.jackson.time-zone=UTC

# --- PostgreSQL Database ---
# Change these if your PostgreSQL credentials are different
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/scanly}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:scanly123}
spring.datasource.driver-class-name=org.postgresql.Driver
# PostgreSQL validates the client timezone during connection startup. Pass UTC to
# the driver so non-IANA host aliases such as Asia/Calcutta cannot prevent boot.
spring.datasource.hikari.data-source-properties.options=-c TimeZone=UTC

# --- JPA / Hibernate ---
# "update" auto-creates/updates tables based on your @Entity classes
# (In production, you'd use Flyway/Liquibase migrations instead)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- File Upload ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# --- File Storage Location ---
# Documents will be saved to this folder on your machine
scanly.upload-dir=./uploads

# --- Logging ---
logging.level.com.scanly=INFO
logging.level.org.springframework.security=WARN

# --- JWT ---
# Secret key for signing JWT tokens (base64-encoded, min 256-bit)
scanly.jwt.secret=${SCANLY_JWT_SECRET:c2Nhbmx5LXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1zaWduaW5nLTIwMjY=}
# Token expiration: 24 hours (in milliseconds)
scanly.jwt.expiration-ms=${SCANLY_JWT_EXPIRATION_MS:86400000}

# --- AI Document Extraction (Groq) ---
groq.api.key=${GROQ_API_KEY:}
groq.model=openai/gpt-oss-120b
groq.url=https://api.groq.com/openai/v1/chat/completions
