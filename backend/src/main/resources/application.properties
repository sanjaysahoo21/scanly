# =============================================
# Scanly — Application Configuration
# =============================================

spring.application.name=scanly

# --- Server ---
server.port=8080

# --- PostgreSQL Database ---
# Change these if your PostgreSQL credentials are different
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/scanly
spring.datasource.username=postgres
spring.datasource.password=scanly123
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# "update" auto-creates/updates tables based on your @Entity classes
# (In production, you'd use Flyway/Liquibase migrations instead)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- File Upload ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# --- File Storage Location ---
# Documents will be saved to this folder on your machine
scanly.upload-dir=./uploads

# --- Logging ---
logging.level.com.scanly=DEBUG
logging.level.org.springframework.security=DEBUG

# --- JWT ---
# Secret key for signing JWT tokens (base64-encoded, min 256-bit)
scanly.jwt.secret=c2Nhbmx5LXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1zaWduaW5nLTIwMjY=
# Token expiration: 24 hours (in milliseconds)
scanly.jwt.expiration-ms=86400000
