# =============================================
# Scanly — Application Configuration
# =============================================

spring.application.name=scanly

# --- Server ---
server.port=8080

# --- PostgreSQL Database ---
# Change these if your PostgreSQL credentials are different
spring.datasource.url=jdbc:postgresql://localhost:5432/scanly
spring.datasource.username=postgres
spring.datasource.password=scanly123
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# "update" auto-creates/updates tables based on your @Entity classes
# (In production, you'd use Flyway/Liquibase migrations instead)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- File Upload ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# --- File Storage Location ---
# Documents will be saved to this folder on your machine
scanly.upload-dir=./uploads

# --- Logging ---
logging.level.com.scanly=DEBUG
logging.level.org.springframework.security=DEBUG
