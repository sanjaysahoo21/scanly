services:
  db:
    image: postgres:16
    container_name: scanly-db
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=UTC
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - scanly-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  scanly-db-data:
    name: scanly-db-data
