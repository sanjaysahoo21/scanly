version: '3.8'

services:
  db:
    image: postgres:16
    container_name: scanly-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=scanly123
      - POSTGRES_DB=scanly
      - TZ=UTC
    ports:
      - "5432:5432"
    volumes:
      - scanly-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  scanly-db-data:
    name: scanly-db-data
