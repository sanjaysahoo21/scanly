services:
  db:
    image: postgres:16
    container_name: scanly-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      - POSTGRES_DB=${POSTGRES_DB:-scanly}
      - TZ=UTC
    ports:
      - "5433:5432"
    volumes:
      - scanly-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  scanly-db-data:
    name: scanly-db-data
